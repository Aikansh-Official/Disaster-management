    <text x="315" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0d6b7a">45</text>
    <text x="315" y="292" text-anchor="middle" class="small">TIME REMAINING</text>
    <rect x="40" y="320" width="550" height="96" rx="22" fill="#eaf6f2" stroke="#0d6b7a" stroke-width="2"/>
    <text x="76" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">B. Hide under desk</text>
    <rect x="40" y="436" width="550" height="76" rx="22" fill="#0d6b7a"/>
    <text x="315" y="484" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Confirm Selection</text>
  </g>

  <g transform="translate(860,820)">
