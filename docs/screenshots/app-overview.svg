    <path d="M86 236 C148 184, 196 170, 250 188 S356 256, 430 220 S520 160, 558 146" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="194" cy="180" r="10" fill="#0d6b7a"/>
    <circle cx="298" cy="220" r="10" fill="#0d6b7a"/>
    <circle cx="428" cy="200" r="10" fill="#0d6b7a"/>
    <rect x="40" y="306" width="550" height="88" rx="22" fill="#ffffff" stroke="#e5edf2"/>
    <text x="64" y="344" class="label">Nearby Safe Zones</text>
    <text x="64" y="370" class="small">Get directions, bookmark locations, and see offline status.</text>
    <rect x="40" y="416" width="550" height="108" rx="22" fill="#ffffff" stroke="#e5edf2"/>
    <text x="64" y="452" class="label">Assembly Point</text>
    <text x="64" y="480" class="small">Primary Shelter - 0.8 km</text>
  </g>

  <g transform="translate(110,1460)">
