    <rect x="18" y="18" width="594" height="524" rx="34" fill="#ffffff"/>
    <text x="315" y="66" text-anchor="middle" class="title" font-size="26">Training Hub</text>
    <rect x="40" y="108" width="96" height="40" rx="20" fill="#0d6b7a"/>
    <text x="88" y="134" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Fire</text>
    <rect x="146" y="108" width="104" height="40" rx="20" fill="#dbeee9"/>
    <text x="198" y="134" text-anchor="middle" class="body" font-size="16">Flood</text>
    <rect x="260" y="108" width="88" height="40" rx="20" fill="#dbeee9"/>
    <text x="304" y="134" text-anchor="middle" class="body" font-size="16">Wind</text>
