<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafb"/>
      <stop offset="100%" stop-color="#e6edf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0d6b7a; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 16px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .small { font: 14px Arial, Helvetica, sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1600" height="2100" fill="url(#bg)"/>
  <text x="800" y="90" text-anchor="middle" class="title">Disaster Management App Overview</text>
  <text x="800" y="126" text-anchor="middle" class="body">Dashboard, learning, drills, safety map, profile, and badges in one mobile experience</text>

  <g transform="translate(110,180)">
    <rect width="630" height="560" rx="42" fill="#0b1220" filter="url(#shadow)"/>
    <rect x="18" y="18" width="594" height="524" rx="34" fill="#ffffff"/>
    <rect x="18" y="18" width="594" height="78" rx="34" fill="#ffffff"/>
    <text x="315" y="66" text-anchor="middle" class="title" font-size="26">Dashboard</text>
    <rect x="28" y="116" width="574" height="84" rx="24" fill="#fbe0db"/>
    <text x="56" y="150" class="label">Heavy Rain Warning</text>
    <text x="56" y="176" class="small">Avoid low-lying areas and prepare for heavy rainfall.</text>
    <rect x="28" y="222" width="574" height="170" rx="24" fill="#0d6b7a"/>
    <text x="56" y="264" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Overall Readiness</text>
    <circle cx="155" cy="312" r="54" fill="none" stroke="#ffffff" stroke-width="14" stroke-dasharray="240 100"/>
    <text x="155" y="320" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">40%</text>
    <rect x="28" y="414" width="574" height="108" rx="24" fill="#ffffff" stroke="#e5edf2"/>
    <text x="56" y="452" class="label">Drills Completed</text>
    <text x="56" y="490" class="body" font-size="32">4 / 10</text>
    <text x="388" y="452" class="label">Tips Read</text>
    <text x="388" y="490" class="body" font-size="32">12</text>
  </g>

  <g transform="translate(860,180)">
