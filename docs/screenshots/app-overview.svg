    <rect x="18" y="18" width="594" height="524" rx="34" fill="#ffffff"/>
    <text x="315" y="66" text-anchor="middle" class="title" font-size="26">Profile</text>
    <circle cx="315" cy="180" r="54" fill="#f7efe8"/>
    <text x="315" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0d6b7a">USER</text>
    <text x="315" y="268" text-anchor="middle" class="label">Silver Responder</text>
    <circle cx="315" cy="388" r="82" fill="none" stroke="#d8e1ea" stroke-width="18"/>
    <circle cx="315" cy="388" r="82" fill="none" stroke="#0d6b7a" stroke-width="18" stroke-dasharray="300 200" stroke-linecap="round"/>
    <text x="315" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">40%</text>
  </g>

  <g transform="translate(860,1460)">
    <rect width="630" height="560" rx="42" fill="#0b1220" filter="url(#shadow)"/>
    <rect x="18" y="18" width="594" height="524" rx="34" fill="#ffffff"/>
    <text x="315" y="66" text-anchor="middle" class="title" font-size="26">Badges</text>
    <rect x="40" y="112" width="550" height="92" rx="22" fill="#ffffff" stroke="#e5edf2"/>
    <text x="66" y="146" class="label">Fire Safety</text>
    <text x="66" y="174" class="small">Unlocked</text>
    <circle cx="548" cy="158" r="18" fill="#0a7f42"/>
    <text x="548" y="165" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">✓</text>
    <rect x="40" y="222" width="550" height="92" rx="22" fill="#ffffff" stroke="#e5edf2"/>
    <text x="66" y="256" class="label">First Aid</text>
    <text x="66" y="284" class="small">Unlocked</text>
    <circle cx="548" cy="268" r="18" fill="#0a7f42"/>
    <text x="548" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">✓</text>
    <rect x="40" y="332" width="550" height="92" rx="22" fill="#ffffff" stroke="#e5edf2"/>
    <text x="66" y="366" class="label">Earthquake</text>
    <text x="66" y="394" class="small">Locked</text>
    <circle cx="548" cy="378" r="18" fill="#757575"/>
    <text x="548" y="385" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">⌂</text>
  </g>
