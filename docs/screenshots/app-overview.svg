    <text x="62" y="242" class="small">Learn essential prevention techniques.</text>
    <rect x="420" y="202" width="136" height="30" rx="15" fill="#1f2937"/>
    <text x="488" y="222" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">IN PROGRESS</text>
    <rect x="40" y="302" width="550" height="108" rx="24" fill="#ffffff" stroke="#e5edf2"/>
    <text x="62" y="340" class="label">Flood Evacuation</text>
    <text x="62" y="368" class="small">Understand local flood zones and pack kits.</text>
